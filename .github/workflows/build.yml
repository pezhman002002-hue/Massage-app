name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp main.dart /tmp/main.dart
          flutter create --platforms=android --project-name messenger_app --org com.example .
          cp /tmp/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/main.dart lib/main.dart
          rm -rf test

      - name: Patch manifest (internet access, plain ws://, app name)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $F
          sed -i 's|android:label="[^"]*"|android:label="Messenger"|' $F
          cat $F

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
